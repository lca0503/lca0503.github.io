<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip | escape }}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script>
    try {
      const saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {}
  </script>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}, home"><span class="wordmark-symbol" aria-hidden="true">CA</span><span>{{ site.title }}</span></a>
      <nav aria-label="Main navigation">
        <a {% if page.section == 'about' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">About</a>
        <a {% if page.section == 'publications' %}aria-current="page"{% endif %} href="{{ '/publications/' | relative_url }}">Publications</a>
        <a class="nav-cv" href="{{ '/assets/pdf/cv.pdf' | relative_url }}" target="_blank" rel="noopener">CV <span aria-hidden="true">↗</span></a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch color theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 13.1A8.7 8.7 0 0 1 10.9 3.2 8.8 8.8 0 1 0 20.8 13.1Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main">{{ content }}</main>
  <footer class="site-footer">
    <div><a class="footer-name" href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
    <div class="footer-links"><a href="mailto:{{ site.email }}">Email <span aria-hidden="true">↗</span></a><a href="{{ site.scholar_url }}" target="_blank" rel="noopener">Google Scholar <span aria-hidden="true">↗</span></a><a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a><a href="{{ site.x_url }}" target="_blank" rel="noopener">X <span aria-hidden="true">↗</span></a><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a><span>© {{ 'now' | date: '%Y' }}</span></div>
  </footer>
</body>
</html>
